[mypy]
python_version = 3.11
warn_unused_configs = True

# CI intentionally uses requirements-ci.txt rather than the optional ML,
# cache, and analytics integrations from requirements.txt. A few installed
# packages also do not ship type information. Keep exceptions limited to those
# external packages so typos and missing internal imports remain type-check
# failures.
[mypy-redis]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-jose]
ignore_missing_imports = True

[mypy-whisper]
ignore_missing_imports = True

[mypy-faiss]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-pypdf]
ignore_missing_imports = True

[mypy-api_analytics.*]
ignore_missing_imports = True

[mypy-aiofiles]
ignore_missing_imports = True
