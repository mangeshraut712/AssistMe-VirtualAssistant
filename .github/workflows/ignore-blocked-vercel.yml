# Vercel GitHub App still posts a failing "Vercel" commit status because
# the Vercel account is blocked. Hosting is GitHub Pages; overwrite that
# status so CI is not red.
#
# Do not use on: status + cancel-in-progress: Dependabot bursts cancelled
# the override jobs before they posted. Wait for Vercel to post, then
# overwrite this SHA only.

name: Ignore blocked Vercel status

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ignore-blocked-vercel-${{ github.sha }}
  cancel-in-progress: false

permissions:
  statuses: write

jobs:
  override:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel GitHub App status
        run: sleep 25

      - name: Mark Vercel status success (GitHub Pages is production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=Vercel \
            -f description='Skipped: production is GitHub Pages (Vercel account blocked)' \
            -f target_url='https://mangeshraut712.github.io/AssistMe-VirtualAssistant/'
