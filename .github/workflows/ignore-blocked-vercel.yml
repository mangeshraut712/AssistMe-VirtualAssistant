# Vercel GitHub App still posts a failing "Vercel" commit status because
# the Vercel account is blocked. Hosting is GitHub Pages; overwrite that
# status so CI is not red. Safe: only runs on Vercel failures.

name: Ignore blocked Vercel status

on:
  status:

permissions:
  statuses: write

jobs:
  override:
    if: github.event.context == 'Vercel' && github.event.state != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark Vercel status success (GitHub Pages is production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.sha }}" \
            -f state=success \
            -f context=Vercel \
            -f description='Skipped: production is GitHub Pages (Vercel account blocked)' \
            -f target_url='https://mangeshraut712.github.io/AssistMe-VirtualAssistant/'
