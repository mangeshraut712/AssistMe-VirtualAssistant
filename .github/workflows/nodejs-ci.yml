# AssistMe Virtual Assistant - CI/CD Pipeline
# This workflow runs on push and PR to main branch

name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Frontend Build & Test
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend project configuration
        run: npm run typecheck

      - name: Run unit tests
        run: npm test
        
      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Check build output
        run: |
          echo "✅ Frontend build completed successfully"
          ls -lah dist/
          echo "Bundle sizes:"
          du -sh dist/*
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Backend Linting & Validation
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install -r requirements-ci.txt
          pip install flake8 mypy pytest
          
      - name: Syntax check
        run: python -m compileall backend/app -q

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q
        
      - name: Lint with flake8
        working-directory: backend
        run: |
          # Stop build on syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full lint using project config (expects 0 errors)
          flake8 app --count --statistics
          
      - name: Type check with mypy
        working-directory: backend
        run: mypy app --config-file mypy.ini --no-pretty
          
      - name: Validate API structure
        run: |
          echo "✅ Backend validation completed"
          python -c "from backend.app.main import app; print('FastAPI app loaded successfully')"

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        
      - name: Check for secrets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          matches="$(git grep -IlE "(api_key|apikey|secret|password|token)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]" -- src backend/app)"
          grep_status=$?
          set -e
          case "${grep_status}" in
            0)
              echo "::error::Potential hard-coded secret assignments found in:"
              while IFS= read -r file; do
                printf '  - %s\n' "${file}"
              done <<<"${matches}"
              exit 1
              ;;
            1)
              echo "No likely hard-coded secret assignments found."
              ;;
            *)
              echo "::error::Secret scan failed (git grep exit ${grep_status})."
              exit "${grep_status}"
              ;;
          esac

  # Summary Job
  ci-success:
    name: CI Success
    needs: [frontend, backend, security]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: CI Pipeline Passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "Frontend: ✅"
          echo "Backend: ✅"
          echo "Security: ✅"

