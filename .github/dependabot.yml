# Keep Dependabot off npm_and_yarn for the Bun Next.js skill template
# (.agents/skills/... has bun.lock only). Security updates still discovered
# that tree after directory: / was set, so exclude it and declare bun there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - ".agents/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: bun
    directory: /.agents/skills/app-store-screenshots/template
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
