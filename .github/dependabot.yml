# Production app is Vite at repo root plus FastAPI in backend/.
# Ignore .agents in case a nested package.json appears again.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - ".agents/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
