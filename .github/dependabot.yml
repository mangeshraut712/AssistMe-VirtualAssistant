# Dependabot was scanning every package.json, including the Bun-based
# Next.js sample under .agents/skills (no package-lock.json). That job
# fails as misconfigured_tooling and is not the production Vite app.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
